name: Publish FloatDesk bootstrap
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-bootstrap.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and publish the prepared installer
        run: node .github/scripts/publish-bootstrap.mjs
        env:
          GH_TOKEN: ${{ github.token }}
